name: CI build
on: [ push, pull_request ]
jobs:
    build:
        name: PHP ${{ matrix.php-versions }} on ${{ matrix.operating-system }} ${{ matrix.extra-label }} ${{ matrix.composer-dependencies }}
        runs-on: ${{ matrix.operating-system }}
        strategy:
            fail-fast: false
            matrix:
                operating-system: [ ubuntu-latest ]
                php-versions: [ '8.2', '8.3', '8.4', '8.5' ]
                composer-dependencies: [ '', '--prefer-lowest' ]
                extra-label: [ '' ]
                include:

                    # Windows
                    -   php-versions: '8.2'
                        operating-system: windows-latest
                        coverage: xdebug

                    # Windows
                    -   php-versions: '8.3'
                        operating-system: windows-latest
                        coverage: xdebug

                    # Windows
                    -   php-versions: '8.4'
                        operating-system: windows-latest
                        coverage: xdebug

                    # Windows
                    -   php-versions: '8.5'
                        operating-system: windows-latest
                        coverage: xdebug

        steps:
            # see https://github.com/actions/checkout/issues/226#issue-606867805
            -   name: Prepare git
                run: git config --global core.autocrlf false

            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Setup PHP, with composer and extensions
                uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
                with:
                    php-version: ${{ matrix.php-versions }}
                    ini-values: memory_limit=-1
                    tools: composer:v2
                    coverage: ${{ matrix.coverage }}

            -   name: Get composer cache directory
                id: composer-cache
                shell: bash
                run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            -   name: Cache dependencies
                uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
                    restore-keys: ${{ runner.os }}-composer-

            -   name: Install Composer dependencies
                run: composer update --no-progress --prefer-dist --optimize-autoloader ${{ matrix.composer-dependencies }}

            -   name: Run CI Build
                run: composer ci

            # Only jobs with a coverage driver can make the clover report
            -   name: Upload coverage results to Coveralls
                if: ${{ matrix.coverage }}
                env:
                    COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    composer test -- --coverage-clover build/logs/clover.xml
                    composer global require php-coveralls/php-coveralls
                    php-coveralls --coverage_clover=build/logs/clover.xml -v
